[project]
name = "coding-agent"
version = "0.1.0"
description = "A self-contained coding agent kernel with an explicit AgentLoop, local tools, resource-aware context projection and completion verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40,<3",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
